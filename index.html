<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Arinad Maison — Accessories & Elegance">
  <title>Arinad Maison</title>
  <style>
    :root{
      --bg:#050505;
      --card:#0d0d0d;
      --text:#f7f7f7;
      --muted:#9b9b9b;
      --line:#242424;
      --accent:#ffffff;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 50% 0%, #191919 0%, #090909 35%, #050505 70%);
      color:var(--text);
      font-family: Georgia, "Times New Roman", serif;
      display:flex;
      justify-content:center;
    }
    .page{
      width:min(100%, 560px);
      padding:48px 22px 36px;
      text-align:center;
    }
    .brand-mark{
      width:118px;
      height:118px;
      border-radius:50%;
      object-fit:cover;
      display:block;
      margin:0 auto 24px;
      border:1px solid #2b2b2b;
      box-shadow:0 12px 45px rgba(0,0,0,.55);
    }
    h1{
      margin:0;
      font-size:clamp(34px,8vw,52px);
      font-weight:500;
      letter-spacing:2px;
    }
    .tagline{
      margin:12px 0 34px;
      color:var(--muted);
      font-family:Arial, sans-serif;
      font-size:13px;
      letter-spacing:3px;
      text-transform:uppercase;
    }
    .links{
      display:grid;
      gap:13px;
    }
    .link{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:62px;
      padding:16px 52px;
      border:1px solid var(--line);
      border-radius:14px;
      background:linear-gradient(180deg,#111 0%,#0a0a0a 100%);
      color:var(--text);
      text-decoration:none;
      font-family:Arial, sans-serif;
      font-size:15px;
      letter-spacing:.4px;
      transition:transform .2s ease,border-color .2s ease,background .2s ease;
    }
    .link:hover{
      transform:translateY(-2px);
      border-color:#666;
      background:#151515;
    }
    .icon{
      position:absolute;
      left:20px;
      width:22px;
      height:22px;
      display:grid;
      place-items:center;
      font-size:15px;
      color:#ddd;
    }
    footer{
      margin-top:34px;
      color:#666;
      font-family:Arial,sans-serif;
      font-size:11px;
      letter-spacing:1.5px;
    }
    @media (max-width:420px){
      .page{padding-top:34px}
      .brand-mark{width:102px;height:102px}
      .link{min-height:58px}
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="brand-mark" src="logo.jpg" alt="Arinad Maison logo">
    <h1>Arinad Maison</h1>
    <div class="tagline">Accessories &amp; Elegance</div>

    <nav class="links" aria-label="Arinad Maison links">
      <a class="link" href="https://www.instagram.com/arinad.maison/" target="_blank" rel="noopener">
        <span class="icon">◎</span>Instagram
      </a>
      <a class="link" href="https://wa.me/213556836854" target="_blank" rel="noopener">
        <span class="icon">◌</span>WhatsApp
      </a>
    </nav>

    <footer>ARINAD MAISON</footer>
  </main>
</body>
</html>
